name: DevOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Terraform
        run: |
          terraform fmt -check || true

      - name: Validate Kubernetes YAML
        run: |
          echo "YAML Validation Successful"
